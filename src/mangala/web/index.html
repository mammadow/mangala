<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turkish Mangala</title>
<meta name="description" content="Turkish Mangala (mancala) with a strong minimax AI">
<link rel="icon" href="data:,">
<style>
:root{
  --bg0:#0e0b14; --bg1:#171226; --felt0:#1c5d4e; --felt1:#0e3b31;
  --wood0:#5a3a1f; --wood1:#3c2512; --rim:#241408;
  --pit0:#caa46e; --pit1:#9c763f; --pit-in:#7a5526;
  --treas0:#e7cd9a; --treas1:#b48c52;
  --stone0:#fff4dd; --stone1:#e6b873; --stone-edge:#a9762f;
  --gold:#ffce3a; --p1:#5aa6ff; --p2:#ff6b6b; --green:#46d18a; --cyan:#21d6cc;
  --text:#f1e9d6; --dim:#a99a7c; --ink:#2a1a08;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1200px 700px at 50% -10%,#241a36 0%,var(--bg1) 45%,var(--bg0) 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;user-select:none;
}
.app{width:min(1100px,96vw);}

/* ── header ─────────────────────────────────────────────── */
header{display:flex;align-items:center;justify-content:space-between;
  padding:6px 4px 14px;}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-family:Georgia,serif;font-size:30px;letter-spacing:.5px;
  background:linear-gradient(90deg,#ffe6a3,#e2b15a);-webkit-background-clip:text;
  background-clip:text;color:transparent;font-weight:700}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 14px var(--gold)}
.toolbar{display:flex;gap:8px}
.btn{font:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;
  background:linear-gradient(180deg,#6b4824,#4a2f15);border:1px solid #2c1a09;
  border-radius:10px;padding:9px 16px;box-shadow:0 2px 0 #2c1a09,0 6px 14px rgba(0,0,0,.35);
  transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #2c1a09}
.btn:disabled{opacity:.4;cursor:default;filter:none;transform:none}
.btn.ghost{background:transparent;border:1px solid #4a3a22;color:var(--dim);
  box-shadow:none}
.btn.ghost:hover{color:var(--text)}
.btn.ghost.on{color:var(--gold);border-color:var(--gold)}

/* ── scoreboard ─────────────────────────────────────────── */
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;
  align-items:center;margin-bottom:14px}
.pcard{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  transition:box-shadow .25s,border-color .25s,background .25s}
.pcard.right{flex-direction:row-reverse;text-align:right}
.pcard .who{font-size:13px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.pcard .sc{font-size:34px;font-weight:800;line-height:1}
.pcard .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
  background:rgba(255,255,255,.08)}
.pcard.p1 .sc{color:var(--p1)} .pcard.p2 .sc{color:var(--p2)}
.pcard.active{background:rgba(255,255,255,.08)}
.pcard.p1.active{border-color:var(--p1);box-shadow:0 0 26px rgba(90,166,255,.35)}
.pcard.p2.active{border-color:var(--p2);box-shadow:0 0 26px rgba(255,107,107,.35)}
.turnchip{display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:12px;color:var(--dim);white-space:nowrap}
.turnchip .big{font-size:15px;font-weight:700;color:var(--text)}

/* ── board ──────────────────────────────────────────────── */
.board{position:relative;border-radius:30px;padding:22px;
  background:linear-gradient(160deg,var(--wood0),var(--wood1));
  box-shadow:inset 0 2px 6px rgba(255,255,255,.12),inset 0 -8px 24px rgba(0,0,0,.5),
    0 24px 60px rgba(0,0,0,.55);border:2px solid var(--rim)}
.felt{display:grid;grid-template-columns:auto 1fr auto;gap:18px;
  background:radial-gradient(120% 120% at 50% 0%,var(--felt0),var(--felt1));
  border-radius:22px;padding:18px;border:2px solid rgba(0,0,0,.4);
  box-shadow:inset 0 0 60px rgba(0,0,0,.45)}
.rows{display:flex;flex-direction:column;gap:16px;justify-content:center}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.rowlabel{font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.5);text-align:center;margin:2px 0}
.rowlabel.p1{color:var(--p1)} .rowlabel.p2{color:var(--p2)}

/* ── flipped board (180° rotation) ──────────────────────────
   Rotate the felt so the other player's pits sit at the bottom,
   then counter-rotate every text element so labels/counts stay
   upright and readable. Purely visual — pit indices/logic unchanged. */
.felt{transition:transform .4s cubic-bezier(.4,.1,.2,1)}
.board.flipped .felt{transform:rotate(180deg)}
.board.flipped .felt .count{transform:translateX(-50%) rotate(180deg)}
.board.flipped .felt .pid,
.board.flipped .felt .tlabel,
.board.flipped .felt .tcount,
.board.flipped .felt .rowlabel,
.board.flipped .felt .stones{transform:rotate(180deg)}

/* pit */
.pit{position:relative;aspect-ratio:1/1.04;border-radius:50%;cursor:default;
  background:radial-gradient(circle at 38% 30%,var(--pit0),var(--pit1) 70%,var(--pit-in));
  box-shadow:inset 0 6px 14px rgba(0,0,0,.55),inset 0 -3px 6px rgba(255,255,255,.18),
    0 3px 6px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,box-shadow .2s}
.pit .count{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
  font-size:12px;font-weight:800;color:var(--ink);
  background:rgba(255,244,221,.85);border-radius:10px;padding:0 7px;
  box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pit .pid{position:absolute;font-size:10px;font-weight:700;opacity:.7}
.row.p1row .pit .pid{bottom:-20px;color:var(--p1)}
.row.p2row .pit .pid{top:-20px;color:var(--p2)}
.stones{position:absolute;inset:8% ;display:flex;flex-wrap:wrap;
  align-content:center;justify-content:center;gap:2px}
.stone{width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--stone0),var(--stone1) 75%);
  box-shadow:inset 0 -1px 2px var(--stone-edge),0 1px 2px rgba(0,0,0,.45);
  animation:pop .22s ease}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

.pit.legal{cursor:pointer;box-shadow:inset 0 6px 14px rgba(0,0,0,.45),
  0 0 0 3px var(--gold),0 0 22px rgba(255,206,58,.55);animation:breathe 1.6s ease-in-out infinite}
.pit.legal:hover{transform:translateY(-4px) scale(1.05)}
@keyframes breathe{0%,100%{box-shadow:inset 0 6px 14px rgba(0,0,0,.45),0 0 0 3px var(--gold),0 0 16px rgba(255,206,58,.4)}
  50%{box-shadow:inset 0 6px 14px rgba(0,0,0,.45),0 0 0 3px var(--gold),0 0 30px rgba(255,206,58,.75)}}
.pit.sowing{box-shadow:inset 0 6px 14px rgba(0,0,0,.45),0 0 0 3px var(--gold),0 0 26px var(--gold)}
.pit.source{box-shadow:inset 0 6px 14px rgba(0,0,0,.45),0 0 0 3px var(--p1),0 0 18px var(--p1)}
.pit.capture{box-shadow:inset 0 6px 14px rgba(0,0,0,.45),0 0 0 3px var(--p2),0 0 26px var(--p2);animation:shake .4s}
.pit.hint{box-shadow:inset 0 6px 14px rgba(0,0,0,.45),0 0 0 3px var(--cyan),0 0 26px var(--cyan);animation:breathe 1.2s ease-in-out infinite}
.pit.invalid{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}
  40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* treasury */
.treas{position:relative;width:104px;border-radius:54px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:10px 0;
  background:radial-gradient(circle at 40% 18%,var(--treas0),var(--treas1) 75%);
  box-shadow:inset 0 8px 20px rgba(0,0,0,.5),inset 0 -4px 8px rgba(255,255,255,.2),
    0 4px 10px rgba(0,0,0,.4);transition:box-shadow .25s}
.treas .stones{position:relative;inset:auto;min-height:120px;align-content:flex-end;padding:6px}
.treas .tlabel{font-size:10px;letter-spacing:1px;color:var(--ink);opacity:.7;margin-bottom:4px}
.treas .tcount{font-size:26px;font-weight:800;color:var(--ink)}
.treas.p1{order:2}
.treas.glow{box-shadow:inset 0 8px 20px rgba(0,0,0,.4),0 0 0 4px var(--green),0 0 34px rgba(70,209,138,.7)}

/* banner */
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);
  padding:16px 34px;border-radius:16px;font-size:26px;font-weight:800;
  background:rgba(10,8,4,.86);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 50px rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;white-space:nowrap;z-index:5}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ── footer / log ───────────────────────────────────────── */
.footer{display:grid;grid-template-columns:1fr auto;gap:14px;margin-top:14px;align-items:start}
.log{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06);border-radius:12px;
  padding:10px 14px;min-height:54px;max-height:88px;overflow:hidden}
.log h4{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.log .line{font-size:13px;margin:2px 0;opacity:0;animation:fadein .3s forwards}
.log .line.p1{color:var(--p1)} .log .line.p2{color:var(--p2)}
@keyframes fadein{to{opacity:1}}
.analysis{display:flex;gap:8px}

/* ── overlays (menu / win) ──────────────────────────────── */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(8,6,12,.78);backdrop-filter:blur(6px);z-index:20}
.overlay.hidden{display:none}
.panel{width:min(460px,92vw);background:linear-gradient(170deg,#241a32,#15101f);
  border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:30px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
.panel h2{font-family:Georgia,serif;font-size:28px;margin-bottom:6px}
.panel p.sub{color:var(--dim);margin-bottom:22px;font-size:14px}
.menu{display:flex;flex-direction:column;gap:11px}
.mbtn{font:inherit;font-size:16px;font-weight:600;color:var(--text);cursor:pointer;
  padding:15px;border-radius:12px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);transition:.15s;display:flex;justify-content:space-between;align-items:center}
.mbtn:hover{background:rgba(255,255,255,.1);transform:translateX(3px)}
.mbtn small{color:var(--dim);font-weight:400;font-size:12px}
.win h2{font-size:40px}
.win .score{font-size:20px;color:var(--dim);margin:8px 0 24px}
.row-btns{display:flex;gap:10px;justify-content:center}
.back{margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span><h1>Turkish Mangala</h1></div>
    <div class="toolbar">
      <button class="btn ghost" id="flipBtn" title="Rotate the board 180°">⟲ Flip</button>
      <button class="btn ghost" id="menuBtn">Menu</button>
      <button class="btn" id="newBtn">New Game</button>
    </div>
  </header>

  <div class="scorebar">
    <div class="pcard p1" id="card1">
      <div><div class="who">Player 1</div><div class="sc" id="sc1">0</div></div>
      <div class="badge" id="badge1">You</div>
    </div>
    <div class="turnchip">
      <span id="turnBig" class="big">—</span>
      <span id="turnSub">choose a mode</span>
    </div>
    <div class="pcard p2 right" id="card2">
      <div><div class="who">Player 2</div><div class="sc" id="sc2">0</div></div>
      <div class="badge" id="badge2">AI</div>
    </div>
  </div>

  <div class="board">
    <div class="felt">
      <!-- P2 treasury (left) -->
      <div class="treas p2" id="t13">
        <div class="tlabel">P2 HAZINE</div>
        <div class="stones"></div>
        <div class="tcount">0</div>
      </div>

      <div class="rows">
        <div class="rowlabel p2">Player 2  ◄  sowing direction</div>
        <div class="row p2row" id="row2"></div>
        <div class="row p1row" id="row1"></div>
        <div class="rowlabel p1">Player 1  ►  sowing direction</div>
      </div>

      <!-- P1 treasury (right) -->
      <div class="treas p1" id="t6">
        <div class="tlabel">P1 HAZINE</div>
        <div class="stones"></div>
        <div class="tcount">0</div>
      </div>
    </div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="footer">
    <div class="log">
      <h4>Last moves</h4>
      <div id="logLines"></div>
    </div>
    <div class="analysis" id="analysisTools" style="display:none">
      <button class="btn ghost" id="undoBtn">↶ Undo</button>
      <button class="btn ghost" id="redoBtn">↷ Redo</button>
      <button class="btn ghost" id="passBtn">Pass</button>
      <button class="btn ghost" id="hintBtn">💡 Hint</button>
    </div>
  </div>
</div>

<!-- menu overlay -->
<div class="overlay" id="menuOverlay">
  <div class="panel">
    <h2>Turkish Mangala</h2>
    <p class="sub">Choose a game mode</p>
    <div class="menu" id="modeMenu">
      <button class="mbtn" data-mode="hvh">Human vs Human <small>local 2-player</small></button>
      <button class="mbtn" data-mode="hva">Human vs AI <small>pick your side</small></button>
      <button class="mbtn" data-mode="ava">AI vs AI <small>watch it play</small></button>
      <button class="mbtn" data-mode="analysis">Analysis <small>hints · undo · pass</small></button>
    </div>
    <div class="menu back hidden" id="sideMenu">
      <p class="sub">Which side do you play?</p>
      <button class="mbtn" data-side="0">Play as Player 1 <small>moves first</small></button>
      <button class="mbtn" data-side="1">Play as Player 2 <small>moves second</small></button>
      <button class="btn ghost" id="sideBack">‹ Back</button>
    </div>
  </div>
</div>

<!-- win overlay -->
<div class="overlay hidden" id="winOverlay">
  <div class="panel win">
    <h2 id="winTitle">Player 1 Wins!</h2>
    <div class="score" id="winScore">0 — 0</div>
    <div class="row-btns">
      <button class="btn" id="winAgain">Play Again</button>
      <button class="btn ghost" id="winMenu">Main Menu</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="ai.js"></script>
<script>
// ── constants mirroring game.py ────────────────────────────────────────────
const P1_PITS=[0,1,2,3,4,5], P1_TREAS=6, P2_PITS=[7,8,9,10,11,12], P2_TREAS=13, TOTAL=14;
const OPP_TREAS=[P2_TREAS,P1_TREAS], OWN_TREAS=[P1_TREAS,P2_TREAS];
const PLAYER_PITS=[P1_PITS,P2_PITS];

// ── timing ─────────────────────────────────────────────────────────────────
const SOW_DELAY=210, CAP_DELAY=520, BANNER_MS=1100, AI_PAUSE=420, AIAI_PAUSE=700;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ── state ──────────────────────────────────────────────────────────────────
let S=null;                 // current GameState dict
let mode=null;              // 'hvh' | 'hva' | 'ava' | 'analysis'
let players=['human','human'];
let coachSide=null;         // analysis: side that gets hints
let busy=false;             // animation / AI in progress -> ignore clicks
let history=[];             // [{state, log}]  for analysis undo/redo
let histIdx=-1;
let logEntries=[];
let flipped=false;          // board rotated 180° (other player's pits at bottom)

// ── DOM build ──────────────────────────────────────────────────────────────
const pitEls={};            // index -> element
function buildBoard(){
  const r1=document.getElementById('row1'), r2=document.getElementById('row2');
  r1.innerHTML=''; r2.innerHTML='';
  // P1 pits 0..5 left->right
  for(let i=0;i<6;i++) r1.appendChild(makePit(i, i+1));
  // P2 pits displayed left->right as 12,11,10,9,8,7
  for(let k=0;k<6;k++){const idx=12-k; r2.appendChild(makePit(idx, idx+1));}
  pitEls[P1_TREAS]=document.getElementById('t6');
  pitEls[P2_TREAS]=document.getElementById('t13');
}
function makePit(idx,label){
  const el=document.createElement('div'); el.className='pit'; el.dataset.idx=idx;
  el.innerHTML=`<div class="stones"></div><div class="count">0</div><div class="pid">${label}</div>`;
  el.addEventListener('click',()=>onPitClick(idx));
  pitEls[idx]=el; return el;
}

// ── rendering ──────────────────────────────────────────────────────────────
function stoneHTML(n){let s=''; const cap=Math.min(n,18); for(let i=0;i<cap;i++)s+='<div class="stone"></div>'; return s;}
function renderPit(idx,n,animate){
  const el=pitEls[idx];
  const isTreas=(idx===P1_TREAS||idx===P2_TREAS);
  if(isTreas) el.querySelector('.tcount').textContent=n;
  else        el.querySelector('.count').textContent=n;
  const box=el.querySelector('.stones');
  if(animate) box.innerHTML=stoneHTML(n);
  else { // avoid re-pop animation when count unchanged
    if(box.childElementCount!==Math.min(n,18)) box.innerHTML=stoneHTML(n);
  }
}
function render(state,opts={}){
  for(let i=0;i<TOTAL;i++) renderPit(i,state.pits[i],false);
  document.getElementById('sc1').textContent=state.pits[P1_TREAS];
  document.getElementById('sc2').textContent=state.pits[P2_TREAS];
  // active card
  document.getElementById('card1').classList.toggle('active',!state.game_over&&state.current_player===0);
  document.getElementById('card2').classList.toggle('active',!state.game_over&&state.current_player===1);
  clearHL();
  if(!busy && !state.game_over && players[state.current_player]==='human'){
    for(const m of (state.legal||[])) pitEls[m].classList.add('legal');
  }
  updateTurnText(state);
  updateAnalysisButtons();
}
function clearHL(){
  document.querySelectorAll('.pit').forEach(p=>p.classList.remove('legal','source','sowing','capture','hint','invalid'));
  pitEls[P1_TREAS].classList.remove('glow'); pitEls[P2_TREAS].classList.remove('glow');
}
function updateTurnText(state){
  const big=document.getElementById('turnBig'), sub=document.getElementById('turnSub');
  if(!state){big.textContent='—';sub.textContent='choose a mode';return;}
  if(state.game_over){big.textContent='Game over';sub.textContent='';return;}
  const p=state.current_player;
  big.textContent=`Player ${p+1}`;
  sub.textContent = players[p]==='ai' ? 'AI is thinking…' : "your turn";
}

// ── board flip (180° rotation) ──────────────────────────────────────────────
function applyFlip(){
  document.querySelector('.board').classList.toggle('flipped',flipped);
  document.getElementById('flipBtn').classList.toggle('on',flipped);
}
function toggleFlip(){ flipped=!flipped; applyFlip(); }

// ── banners ────────────────────────────────────────────────────────────────
async function banner(text,color){
  const b=document.getElementById('banner');
  b.textContent=text; b.style.color=color; b.classList.add('show');
  await sleep(BANNER_MS); b.classList.remove('show'); await sleep(160);
}

// ── API (Dual-Mode: Python HTTP server or Standalone Client-Side) ───────────
let offlineMode = (window.location.protocol === 'file:');

async function localApi(path, body) {
  if (path === '/api/new') {
    return { state: window.MangalaEngine.initialState() };
  }
  if (path === '/api/move') {
    return window.MangalaEngine.applyMove(body.state, body.pit);
  }
  if (path === '/api/ai') {
    const depth = (body.time_limit && body.time_limit <= 1.0) ? 4 : 5;
    const pit = window.MangalaAI.bestMove(body.state, depth);
    return { pit: pit, score: 0, depth: depth };
  }
  throw new Error(`Unknown endpoint: ${path}`);
}

async function api(path, body) {
  if (offlineMode && window.MangalaEngine) {
    return localApi(path, body);
  }
  try {
    const r = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: {'Content-Type': 'application/json'},
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    return data;
  } catch (err) {
    if (window.MangalaEngine) {
      console.info("Server unreachable; running with in-browser client engine.");
      offlineMode = true;
      return localApi(path, body);
    }
    throw err;
  }
}
// Surface server / network errors instead of silently freezing the board.
window.addEventListener('unhandledrejection', e => {
  busy = false;
  document.getElementById('turnSub').textContent = `⚠ ${e.reason && e.reason.message || 'error'}`;
  if (S) updateAnalysisButtons();
});

// ── sow-path simulation (visual only; authoritative state from server) ──────
function sowPath(state,pit){
  const player=state.current_player, opp_t=OPP_TREAS[player];
  let stones=state.pits[pit], toSow = stones>1 ? stones-1 : 1;
  let idx=pit; const path=[];
  for(let s=0;s<toSow;s++){ idx=(idx+1)%TOTAL; if(idx===opp_t) idx=(idx+1)%TOTAL; path.push(idx); }
  return {toSow,path,leaveBehind: stones>1?1:0};
}

// ── animate a move, then commit authoritative server state ──────────────────
async function playMove(pit){
  busy=true; clearHL();
  const player=S.current_player;
  const before=S.pits.slice();
  const {toSow,path,leaveBehind}=sowPath(S,pit);

  // lift from source
  const work=before.slice();
  work[pit]=leaveBehind;
  pitEls[pit].classList.add('source');
  renderPit(pit,work[pit],true);
  await sleep(SOW_DELAY+60);

  // sow one by one
  let last=pit;
  for(let i=0;i<path.length;i++){
    const idx=path[i]; work[idx]+=1; last=idx;
    pitEls[idx].classList.add('sowing');
    renderPit(idx,work[idx],true);
    await sleep(SOW_DELAY);
    pitEls[idx].classList.remove('sowing');
  }
  pitEls[pit].classList.remove('source');

  // authoritative result
  const {state:newState,events}=await api('/api/move',{state:S,pit});

  // capture flash: figure out which pit(s) emptied vs our work view
  if(events.capture>0){
    const drained=[];
    for(let i=0;i<TOTAL;i++){
      if(i===P1_TREAS||i===P2_TREAS) continue;
      if(work[i]>0 && newState.pits[i]===0) drained.push(i);
    }
    for(const d of drained) pitEls[d].classList.add('capture');
    await sleep(CAP_DELAY);
    for(const d of drained) pitEls[d].classList.remove('capture');
    pitEls[OWN_TREAS[player]].classList.add('glow');
  }

  S=newState;
  render(S);
  for(let i=0;i<TOTAL;i++) renderPit(i,S.pits[i],true);

  // event banner
  if(events.capture>0 && events.extra_turn) await banner(`Captured ${events.capture}  +  Extra Turn!`,'#ffce3a');
  else if(events.capture>0) await banner(`Captured ${events.capture} stone${events.capture!==1?'s':''}!`,'#ff6b6b');
  else if(events.extra_turn) await banner('Extra Turn!','#46d18a');

  pitEls[OWN_TREAS[player]].classList.remove('glow');
  addLog(player,pit,events);
  busy=false;
}

// ── turn flow ──────────────────────────────────────────────────────────────
async function onPitClick(idx){
  if(busy||!S||S.game_over) return;
  if(players[S.current_player]!=='human') return;
  if(!(S.legal||[]).includes(idx)){
    pitEls[idx].classList.add('invalid'); setTimeout(()=>pitEls[idx].classList.remove('invalid'),400);
    return;
  }
  await playMove(idx);
  pushHistory();
  render(S);
  await advance();
}

async function advance(){
  // drive AI turns automatically until it's a human's turn or game ends
  while(S && !S.game_over && players[S.current_player]==='ai' && !busy){
    updateTurnText(S);
    const tl = mode==='ava' ? 1.0 : 2.5;
    const {pit}=await api('/api/ai',{state:S,time_limit:tl});
    if(pit===null||pit===undefined) break;
    await playMove(pit);
    pushHistory();
    render(S);
    await sleep(mode==='ava'?AIAI_PAUSE:AI_PAUSE);
  }
  if(S && S.game_over) showWin();
  else render(S);
}

// ── move log ───────────────────────────────────────────────────────────────
function addLog(player,pit,events){
  let parts=[`P${player+1}`,`pit ${pit+1}`];
  if(events.capture>0) parts.push(`✦ captured ${events.capture}`);
  if(events.extra_turn) parts.push('↺ extra turn');
  logEntries.push({player,text:parts.join('   ')});
  renderLog();
}
function renderLog(){
  const box=document.getElementById('logLines'); box.innerHTML='';
  logEntries.slice(-3).reverse().forEach(e=>{
    const d=document.createElement('div'); d.className='line p'+(e.player+1);
    d.textContent=e.text; box.appendChild(d);
  });
}

// ── analysis: history / undo / redo / pass / hint ──────────────────────────
function pushHistory(){
  if(mode!=='analysis') return;
  history=history.slice(0,histIdx+1);
  history.push({state:JSON.parse(JSON.stringify(S)),log:logEntries.slice()});
  histIdx=history.length-1;
}
function updateAnalysisButtons(){
  if(mode!=='analysis') return;
  document.getElementById('undoBtn').disabled = busy||histIdx<=0;
  document.getElementById('redoBtn').disabled = busy||histIdx>=history.length-1;
  document.getElementById('passBtn').disabled = busy||!S||S.game_over;
  document.getElementById('hintBtn').disabled = busy||!S||S.game_over;
}
function undo(){ if(busy||histIdx<=0)return; histIdx--; restore(); }
function redo(){ if(busy||histIdx>=history.length-1)return; histIdx++; restore(); }
function restore(){
  const h=history[histIdx]; S=JSON.parse(JSON.stringify(h.state)); logEntries=h.log.slice();
  renderLog(); render(S); for(let i=0;i<TOTAL;i++) renderPit(i,S.pits[i],true);
}
async function passTurn(){
  if(busy||!S||S.game_over) return;
  const p=S.current_player;
  S={pits:S.pits.slice(),current_player:1-p,game_over:false,winner:null,
     legal: PLAYER_PITS[1-p].filter(i=>S.pits[i]>0)};
  logEntries.push({player:p,text:`P${p+1}   passed`}); renderLog();
  pushHistory(); render(S);
}
async function hint(){
  if(busy||!S||S.game_over) return;
  const hb=document.getElementById('hintBtn'); hb.disabled=true; hb.textContent='💡 …';
  const {pit}=await api('/api/ai',{state:S,time_limit:2.5});
  hb.textContent='💡 Hint';
  if(pit!=null){ clearHL(); pitEls[pit].classList.add('hint');
    document.getElementById('turnSub').textContent=`AI suggests pit ${pit+1}`;}
  updateAnalysisButtons();
}

// ── win screen ─────────────────────────────────────────────────────────────
function showWin(){
  const o=document.getElementById('winOverlay'); o.classList.remove('hidden');
  const p1=S.pits[P1_TREAS], p2=S.pits[P2_TREAS];
  const t=document.getElementById('winTitle');
  if(S.winner===-1){t.textContent="It's a Tie!";t.style.color='#ffce3a';}
  else {t.textContent=`Player ${S.winner+1} Wins!`;t.style.color=S.winner===0?'#5aa6ff':'#ff6b6b';}
  document.getElementById('winScore').textContent=`${p1} — ${p2}`;
}

// ── game setup ─────────────────────────────────────────────────────────────
async function startGame(){
  const {state}=await api('/api/new');
  S=state; logEntries=[]; history=[]; histIdx=-1; busy=false;
  renderLog(); render(S); for(let i=0;i<TOTAL;i++) renderPit(i,S.pits[i],true);
  // badges
  document.getElementById('badge1').textContent = players[0]==='ai'?'AI':'You';
  document.getElementById('badge2').textContent = players[1]==='ai'?'AI':'You';
  document.getElementById('analysisTools').style.display = mode==='analysis'?'flex':'none';
  pushHistory();
  await advance();
}

function chooseMode(m,side){
  mode=m;
  if(m==='hvh') players=['human','human'];
  else if(m==='ava') players=['ai','ai'];
  else if(m==='hva'){players=['ai','ai']; players[side]='human';}
  else if(m==='analysis'){players=['human','human']; coachSide=side;}
  // Auto-orient the board so the human's pits sit at the bottom when
  // playing as Player 2 (hva) or coaching Player 2 (analysis).
  flipped = (side===1);
  applyFlip();
  document.getElementById('menuOverlay').classList.add('hidden');
  startGame();
}

// ── menu wiring ────────────────────────────────────────────────────────────
let pendingMode=null;
document.querySelectorAll('#modeMenu .mbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    const m=b.dataset.mode;
    if(m==='hva'||m==='analysis'){pendingMode=m;
      document.getElementById('modeMenu').classList.add('hidden');
      document.getElementById('sideMenu').classList.remove('hidden');
    } else chooseMode(m,null);
  });
});
document.querySelectorAll('#sideMenu .mbtn').forEach(b=>{
  b.addEventListener('click',()=>chooseMode(pendingMode,parseInt(b.dataset.side)));
});
document.getElementById('sideBack').addEventListener('click',()=>{
  document.getElementById('sideMenu').classList.add('hidden');
  document.getElementById('modeMenu').classList.remove('hidden');
});
function openMenu(){
  document.getElementById('winOverlay').classList.add('hidden');
  document.getElementById('menuOverlay').classList.remove('hidden');
  document.getElementById('sideMenu').classList.add('hidden');
  document.getElementById('modeMenu').classList.remove('hidden');
}
document.getElementById('flipBtn').addEventListener('click',toggleFlip);
document.getElementById('menuBtn').addEventListener('click',openMenu);
document.getElementById('newBtn').addEventListener('click',()=>{if(mode)startGame();else openMenu();});
document.getElementById('winAgain').addEventListener('click',()=>{
  document.getElementById('winOverlay').classList.add('hidden'); startGame();});
document.getElementById('winMenu').addEventListener('click',openMenu);
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('redoBtn').addEventListener('click',redo);
document.getElementById('passBtn').addEventListener('click',passTurn);
document.getElementById('hintBtn').addEventListener('click',hint);
document.addEventListener('keydown',e=>{
  if((e.key==='f'||e.key==='F')&&!e.ctrlKey&&!e.metaKey){e.preventDefault();toggleFlip();return;}
  if(mode!=='analysis')return;
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}
  if(e.ctrlKey&&e.key==='y'){e.preventDefault();redo();}
});

// ── init ───────────────────────────────────────────────────────────────────
buildBoard();
updateTurnText(null);
</script>
