[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mangala-game"
dynamic = ["version"]
description = "Turkish Mangala (mancala) with a strong alpha-beta AI, a web UI, a terminal UI and a Pygame UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mammadow" }]
requires-python = ">=3.10"
dependencies = []  # the engine, AI, web server and CLI are pure standard library
keywords = ["mangala", "mancala", "board-game", "minimax", "alpha-beta", "game-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]

[project.optional-dependencies]
gui = ["pygame>=2.5"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
mangala = "mangala.server:main"
mangala-cli = "mangala.cli:main"
mangala-gui = "mangala.gui_pygame:main"

[project.urls]
Homepage = "https://github.com/mammadow/mangala"
Issues = "https://github.com/mammadow/mangala/issues"
Changelog = "https://github.com/mammadow/mangala/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mangala/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mangala"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "tools/", "docs/", "README.md", "LICENSE", "CHANGELOG.md"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: longer-running AI tests"]

[tool.coverage.run]
source = ["mangala"]
omit = ["*/gui_pygame.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]

# ── ruff (lint only; the codebase keeps its hand-aligned style) ─────────────
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E221",   # multiple spaces before operator (aligned assignments)
    "E241",   # multiple spaces after comma (aligned tables)
    "E702",   # multiple statements on one line (semicolon) — compact GUI handlers
    "E701",   # multiple statements on one line (colon)
    "SIM108", # ternary suggestions
    "RUF001", "RUF002", "RUF003",  # intentional unicode (box drawing, arrows) in strings/comments
]

[tool.ruff.lint.per-file-ignores]
"src/mangala/gui_pygame.py" = ["E402", "E501"]
"tests/*" = ["E501"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
files = [
    "src/mangala/engine.py",
    "src/mangala/ai.py",
    "src/mangala/server.py",
    "src/mangala/cli.py",
    "src/mangala/board.py",
    "src/mangala/__init__.py",
]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["mangala.gui_pygame"]
ignore_errors = true
