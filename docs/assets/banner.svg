<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2e16"/>
      <stop offset="50%" stop-color="#361f0d"/>
      <stop offset="100%" stop-color="#211206"/>
    </linearGradient>
    <radialGradient id="pitGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140a04"/>
      <stop offset="85%" stop-color="#281508"/>
      <stop offset="100%" stop-color="#5a3418"/>
    </radialGradient>
    <radialGradient id="stoneGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="45%" stop-color="#dfd3be"/>
      <stop offset="100%" stop-color="#9a8668"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Board Body -->
  <rect x="20" y="20" width="760" height="200" rx="35" fill="url(#boardGrad)" stroke="#6d411f" stroke-width="4" filter="url(#shadow)"/>
  <rect x="30" y="30" width="740" height="180" rx="28" fill="none" stroke="#2a1608" stroke-width="2"/>

  <!-- P2 Treasury (Left) -->
  <rect x="55" y="45" width="70" height="150" rx="35" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="3"/>
  <!-- P1 Treasury (Right) -->
  <rect x="675" y="45" width="70" height="150" rx="35" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="3"/>

  <!-- Pits Top & Bottom -->
  <!-- Top Row (P2: 12..7) -->
  <circle cx="180" cy="75" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="260" cy="75" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="340" cy="75" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="420" cy="75" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="500" cy="75" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="580" cy="75" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>

  <!-- Bottom Row (P1: 0..5) -->
  <circle cx="180" cy="165" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="260" cy="165" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="340" cy="165" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="420" cy="165" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="500" cy="165" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>
  <circle cx="580" cy="165" r="30" fill="url(#pitGrad)" stroke="#1a0d05" stroke-width="2"/>

  <!-- Decorative Stones in pits -->
  <g filter="url(#shadow)">
    <!-- Pit 0 Stones -->
    <circle cx="174" cy="159" r="6" fill="url(#stoneGrad)"/>
    <circle cx="186" cy="161" r="6" fill="url(#stoneGrad)"/>
    <circle cx="178" cy="171" r="6" fill="url(#stoneGrad)"/>
    <circle cx="185" cy="169" r="5.5" fill="url(#stoneGrad)"/>

    <!-- Pit 2 Stones -->
    <circle cx="334" cy="159" r="6" fill="url(#stoneGrad)"/>
    <circle cx="346" cy="161" r="6" fill="url(#stoneGrad)"/>
    <circle cx="338" cy="171" r="6" fill="url(#stoneGrad)"/>
    <circle cx="345" cy="169" r="5.5" fill="url(#stoneGrad)"/>

    <!-- Pit 9 Stones -->
    <circle cx="414" cy="69" r="6" fill="url(#stoneGrad)"/>
    <circle cx="426" cy="71" r="6" fill="url(#stoneGrad)"/>
    <circle cx="418" cy="81" r="6" fill="url(#stoneGrad)"/>
    <circle cx="425" cy="79" r="5.5" fill="url(#stoneGrad)"/>
  </g>

  <!-- Typography -->
  <text x="380" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#dfd3be" letter-spacing="8">TURKISH MANGALA</text>
</svg>
